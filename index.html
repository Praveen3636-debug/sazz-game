for(const o of obs){if(o.o){const x=o.x;c.strokeStyle='rgba(200,200,220,.6)';c.lineWidth=2;c.beginPath();c.moveTo(x+10,-20);c.lineTo(x+10,GY-170);c.moveTo(x+o.w-10,-20);c.lineTo(x+o.w-10,GY-170);c.stroke();c.fillStyle='rgba(30,18,44,.92)';c.fillRect(x,GY-170,o.w,108);c.strokeStyle='#ff7aa8';c.lineWidth=3;c.strokeRect(x,GY-170,o.w,108);c.font='46px'+EF;c.fillText('📵',x+o.w/2,GY-116)}else{c.font=o.h+'px'+EF;c.fillText('🧳',o.x+22,GY-o.h/2)}}

/* ---------- game logic ---------- */
const scr=()=>Math.floor(dist)+extra,ov=h=>{const o=$('ov');o.style.display=h?'flex':'none';o.innerHTML=h||''};
function B(h,ms){const b=$('bn');b.innerHTML=h;b.className='on';clearTimeout(bt);bt=setTimeout(()=>b.className='',ms)}
function reset(){dist=spd=off=py=vy=sl=inv=stm=love=extra=lastMs=cel=shake=et=stg=bu=0;lives=3;zoom=1;spawnX=600;obs=[];col=[];pa=[];clearTimeout(bt);$('bn').className=''}
function menu(){reset();mode='menu';ov(`<h1>COUPLE RUNNER ❤️</h1><h2>PRAVEEN ❤️ SAZZ LUNA</h2><p><i>"Run Through Distance. Run For Love."</i></p><p><small>HIGH SCORE ${hi} · BEST RUN ${best} · 1000m RUNS ${runs} · HEARTS ${th}</small></p><button onclick="startRun()">START RUN ❤️</button><p><small>Space / ↑ Jump · ↓ Slide · P Pause<br>Mobile: Tap = Jump · Swipe Down = Slide</small></p>`)}
function startRun(){au();reset();mode='play';ov()}
function pz(){if(mode=='play'){mode='pause';ov(`<h1>PAUSED ⏸</h1><button onclick="pz()">RESUME</button><button onclick="startRun()">RESTART</button><button onclick="menu()">MAIN MENU</button>`)}else if(mode=='pause'){mode='play';ov()}}
function jump(){if(mode!='play'||py>0)return;vy=850;py=.1;sl=0;tone(380,.18,'square',.06,720)}
function slide(){if(mode!='play')return;if(py>0)vy=Math.min(vy,-900);sl=.65}
function save(){hi=Math.max(hi,scr());sv('cr_hi',hi)}
function addL(v){love=Math.min(100,love+v);if(love>=100&&!cel){cel=1;burst(PX0,GY-120,40);arp([660,880,1100],.1,.12,'sine');B('<b class=t>LOVE 100% ❤️</b>',2200)}}
function take(k){const r=k.e=='❤️'?[50,8]:k.e=='🌹'?[100,12]:[150,15];extra+=r[0];addL(r[1]);if(k.e=='❤️'){th++;sv('cr_hearts',th)}spark(k.x,GY-k.h);tone(880,.1,'sine',.12);tone(1320,.15,'sine',.1,0,.08)}
function hit(){lives--;inv=1.8;stm=1;shake=16;spd*=.4;love=Math.max(0,love-10);tone(160,.35,'sawtooth',.15,50);if(lives<=0){mode='over';save();ov(`<h1>JOURNEY INTERRUPTED 💔</h1><h2>PRAVEEN ❤️ SAZZ LUNA</h2><p>DISTANCE: ${dist|0} / 1000m<br>SCORE: ${scr()}</p><p><small>Love always finds a way — try again.</small></p><button onclick="startRun()">TRY AGAIN ❤️</button><button onclick="menu()">MAIN MENU</button>`)}}
function spawn(){const o=R()<.35?1:0,x=W+60,ty=()=>{const r=R();return r<.6?'❤️':r<.85?'🌹':'✨'};obs.push({x,w:o?80:44,h:46+R()*14,o});
if(o)for(let i=0;i<3;i++)col.push({x:x+i*34,h:30,e:ty()});else[-30,22,74].forEach((q,i)=>col.push({x:x+q,h:i==1?130:75,e:ty()}));if(R()<.5)col.push({x:x+300,h:40+R()*70,e:ty()})}
function startEnd(){mode='end';et=0;stg=0;bu=0;obs=[];col=[];love=100;py=vy=sl=0;save()}
function finish(){mode='done';runs++;best=Math.max(best,scr());hi=Math.max(hi,scr());sv('cr_runs',runs);sv('cr_best',best);sv('cr_hi',hi);ov(`<h1>JOURNEY COMPLETE 🏆</h1><h2>PRAVEEN ❤️ SAZZ LUNA</h2><p>DISTANCE: 1000 / 1000m<br>FINAL SCORE: ${scr()}<br>LOVE: 100% ❤️</p><p><i>1000 METERS. ONE LOVE. TWO HEARTS.</i></p><p><small>HIGH ${hi} · BEST ${best} · 1000m RUNS ${runs} · HEARTS ${th}</small></p><button onclick="startRun()">PLAY AGAIN ❤️</button><button onclick="menu()">MAIN MENU</button>`)}
const ES=[[4.5,'<b class=t>❤️ 1000 METERS TOGETHER ❤️</b><b class=s>PRAVEEN ❤️ SAZZ LUNA</b>',3400],[8,'<i class=q>"1000 meters run pannitom... aana namma love journey-ku finish line-e illa."</i>',3400],[11.5,'<i class=q>"Dhooram namma journey-a test pannichu... aana namma love-a defeat panna mudiyala."</i>',3400],[15,'<b class="t big">"DISTANCE NAMMA JOURNEY... LOVE NAMMA DESTINATION." ❤️</b>',4800]];

if(mode=='play'){const tg=(7+2.5*dist/1000)*(stm>0?.45:1),v=spd*PXM*dt;spd+=(tg-spd)*Math.min(1,dt*1.4);dist=Math.min(1000,dist+spd*dt);off+=v;ph+=dt*(5+spd*.9);

if(dist>=1000)startEnd()}
else if(mode=='end'){et+=dt;spd*=1-Math.min(1,dt*3);ph+=dt*(et<7.5?4:1);zoom=1+.28*cl(et/12);shake*=.9;

if(et>20&&mode=='end')finish()}
else if(mode!='pause')ph+=dt*2}
